<!DOCTYPE html>
<html>
<head>
  <title>Student Personality Test</title>
  <link rel="stylesheet" href="Quiz_assets/style.css">
</head>
<body>

<div class="container">

  <!-- Progress Bar -->
  <div class="progress-bar">
    <div id="progress"></div>
  </div>

  <p id="stepText">Step 1 of 6</p>

  <!-- Question -->
  <h2 id="questionText">
    I enjoy solving complex problems.
  </h2>

  <!-- Scale Options -->
  <div class="options">

    <div class="scale">
      <div class="circle" data-value="1"></div>
      <div class="circle" data-value="2"></div>
      <div class="circle" data-value="3"></div>
      <div class="circle" data-value="4"></div>
      <div class="circle" data-value="5"></div>
    </div>

    <!-- Labels always visible -->
    <div class="labels">
      <span>Strongly<br>Disagree</span>
      <span>Disagree</span>
      <span>Neutral</span>
      <span>Agree</span>
      <span>Strongly<br>Agree</span>
    </div>

  </div>

  <!-- Navigation Buttons -->
  <div class="navigation">
    <button id="backBtn">Back</button>
    <button id="nextBtn">Next</button>
  </div>

</div>

<script src="Quiz_assets/script.js"></script>
</body>
</html>
